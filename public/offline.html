<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATENEA - Modo Offline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: white;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 500px;
    }
    .icon {
      font-size: 80px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }
    p {
      font-size: 16px;
      color: #d1d5db;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .status {
      background: rgba(31, 41, 55, 0.5);
      border: 2px solid #4b5563;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 30px;
    }
    .status-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .status-item:last-child {
      margin-bottom: 0;
    }
    .indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ef4444;
    }
    .indicator.waiting {
      background: #f59e0b;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    button {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:active {
      transform: scale(0.95);
    }
    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Modo Offline</h1>
    <p>No hay conexión a internet. La aplicación está en modo offline.</p>
    
    <div class="status">
      <div class="status-item">
        <span class="indicator waiting"></span>
        <span>Esperando reconexión...</span>
      </div>
      <div class="status-item">
        <span class="indicator"></span>
        <span>Base de datos local disponible</span>
      </div>
    </div>

    <button onclick="location.reload()">Reintentar Conexión</button>

    <div class="footer">
      <p>Los datos se sincronizarán automáticamente cuando se restablezca la conexión.</p>
    </div>
  </div>

  <script>
    // Verificar conexión cada 2 segundos
    setInterval(() => {
      fetch('/api/health', { method: 'HEAD' })
        .then(() => {
          location.reload();
        })
        .catch(() => {
          // Sin conexión, mantener página offline
        });
    }, 2000);

    // Escuchar cambios de conexión
    window.addEventListener('online', () => {
      location.reload();
    });
  </script>
</body>
</html>
